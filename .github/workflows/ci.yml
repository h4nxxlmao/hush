name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint && pnpm --filter "./shared/*" lint

      - name: Typecheck
        run: pnpm typecheck && pnpm --filter "./shared/*" typecheck

      - name: Test
        run: pnpm test && pnpm --filter "./shared/*" test

      - name: Build
        run: pnpm build

      - name: Smoke test the binary
        run: node dist/index.js --version
